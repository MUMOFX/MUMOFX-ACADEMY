services:
  - type: web
    name: mumofx-academy
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@mumofx.com
      - key: ADMIN_PASSWORD
        value: MumofxAdmin@2026!
